<section class="personal-info">
    <h2 class="section-title">Personal Information</h2>

    <!-- Avatar Section -->
    <div class="user-profile-header">
        <div
            class="avatar-wrapper"
            (click)="fileInput.click()"
        >
            <img
                [ngSrc]="imageUrl()"
                alt="User Avatar"
                class="avatar-img"
                fill
                priority
                decoding="async"
            />
            <div class="edit-overlay">
                <i class="fa-solid fa-pencil"></i>
            </div>
            <input
                #fileInput
                type="file"
                (change)="onFileSelected($event)"
                accept="image/*"
                style="display: none"
            />
        </div>
        <div class="user-details">
            <h3 class="display-name">John Doe</h3>
            <p class="user-role">Manager</p>
        </div>
    </div>

    <!-- Form Section -->
    <form class="user-form">
        <div class="form-field full-width">
            <label>First Name</label>
            <input
                type="text"
                pInputText
                placeholder="John Doe"
                value="John Doe"
            />
        </div>

        <div class="form-field full-width">
            <label>Email</label>
            <input
                type="email"
                pInputText
                placeholder="johndoe123@gmail.com"
                value="johndoe123@gmail.com"
            />
        </div>

        <div class="form-field full-width">
            <label>Address</label>
            <input
                type="text"
                pInputText
                placeholder="123 Street USA, Chicago"
                value="123 Street USA, Chicago"
            />
        </div>

        <div class="form-grid">
            <div class="form-field">
                <label>New Password</label>
                <p-password
                    placeholder="********"
                    [feedback]="false"
                    [toggleMask]="true"
                />
            </div>

            <div class="form-field">
                <label>Confirm Password</label>
                <p-password
                    placeholder="********"
                    [feedback]="false"
                    [toggleMask]="true"
                />
            </div>
        </div>

        <div class="form-footer">
            <button
                type="button"
                class="btn-link"
            >
                Discard Changes
            </button>
            <button
                type="submit"
                class="btn-primary"
            >
                Save Changes
            </button>
        </div>
    </form>
</section>
