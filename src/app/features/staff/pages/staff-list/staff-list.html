<div class="d-flex gap-2 my-2">
    <app-search-bar
        [placeholder]="'shared.SEARCH_PLACEHOLDER' | translate"
        class="w-100"
        (searchEnter)="onSearch($event)"
    ></app-search-bar>

    <app-filter-panel
        [configs]="filterConfig"
        [searchQuery]="searchQuery"
        (applyFilter)="applayFilter($event)"
    />
</div>

<app-data-table />

<app-pagination
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  [total]="total()"
  [limit]="limit()"
  (pageChange)="onPageChange($event)"
/>
