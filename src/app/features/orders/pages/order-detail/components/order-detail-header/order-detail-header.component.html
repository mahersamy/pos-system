<header class="od-header">
  <div class="od-header__left">
    <button class="od-back-btn" (click)="back.emit()">
      <i class="fa-solid fa-arrow-left"></i>
      <span>{{ 'ORDERS.DETAILS.BACK_TO_ORDERS' | translate }}</span>
    </button>

    <div class="od-header__title-group">
      <h1 class="od-header__title">
        {{ 'ORDERS.FIELDS.ORDER_NUMBER' | translate }} {{ order().orderNumber }}
      </h1>
      <div class="od-header__badges">
        <span [class]="statusClass">{{ statusKey | translate }}</span>
        <span class="od-type-chip">{{ typeKey | translate }}</span>
      </div>
    </div>
  </div>

  <div class="od-header__actions">
    <!-- Print Receipt Button -->
    <button class="od-btn od-btn--secondary" (click)="print.emit()">
      <i class="fa-solid fa-print"></i>
      <span>{{ 'ORDERS.DETAILS.PRINT_RECEIPT' | translate }}</span>
    </button>

    <!-- Status Change Dropdown -->
    <div class="position-relative">
      <button class="od-btn od-btn--primary" (click)="toggleActions.emit($event)">
        <i class="fa-solid fa-arrow-progress"></i>
        <span>{{ 'ORDERS.ACTIONS.CHANGE_STATUS' | translate }}</span>
        <i class="fa-solid fa-chevron-down ms-1" style="font-size: 0.75rem;"></i>
      </button>

      @if (actionsOpen()) {
        <div
          class="dropdown-menu show position-absolute end-0 mt-2 shadow border-0"
          style="min-width: 210px; z-index: 1050; background: var(--secondary-color); border: 1px solid rgba(255, 255, 255, 0.08);"
          (click)="$event.stopPropagation()"
        >
          <div class="dropdown-header px-3 py-2 text-muted fw-bold" style="font-size: 0.75rem">
            {{ 'ORDERS.ACTIONS.CHANGE_STATUS' | translate }}
          </div>

          @for (action of availableActions(); track action.status) {
            <button
              class="dropdown-item py-2 px-3 d-flex align-items-center gap-2 text-light"
              (click)="statusChange.emit(action)"
            >
              <span
                class="status-indicator rounded-circle d-inline-block"
                style="width: 8px; height: 8px"
                [ngClass]="action.cls"
              ></span>
              {{ action.label | translate }}
            </button>
          }
        </div>
        <!-- Backdrop -->
        <div
          class="position-fixed top-0 start-0 w-100 h-100"
          style="z-index: 1040"
          (click)="closeActions.emit()"
        ></div>
      }
    </div>
  </div>
</header>
