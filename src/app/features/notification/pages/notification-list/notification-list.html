<section class="notification-screen px-4 py-4 d-flex flex-column gap-4">
    <div
        class="notification-controls d-flex justify-content-between align-items-center flex-shrink-0"
    >
        <div class="tabs d-flex">
            <button
                class="tab-btn px-4 py-2 border-0 fw-semibold"
                [class.active]="activeTab() === 'all'"
                (click)="activeTab.set('all')"
            >
                {{ 'NOTIFICATION.ALL' | translate }}
            </button>
            <button
                class="tab-btn px-4 py-2 border-0 fw-semibold"
                [class.active]="activeTab() === 'unread'"
                (click)="activeTab.set('unread')"
            >
                {{ 'NOTIFICATION.UNREAD' | translate }}
            </button>
        </div>

        <div class="d-flex align-items-center gap-3">
            <span class="notifications-count fs-6"
                >{{ notifications().length }} {{ 'NOTIFICATION.COUNT_LABEL' |
                translate }}</span
            >
            <button
                class="btn mark-read-btn fw-semibold px-4"
                (click)="markAllAsRead()"
            >
                {{ 'NOTIFICATION.MARK_ALL_READ' | translate }}
            </button>
        </div>
    </div>

    <div class="notifications-list flex-grow-1 overflow-auto gap-3">
        @for (notification of filteredNotifications(); track trackById($index,
        notification)) {
        <app-notification-card
            [notification]="notification"
            (delete)="deleteNotification($event)"
        >
        </app-notification-card>
        }
    </div>

    <button
        [disabled]="!hasMore()"
        class="btn btn-primary"
        (click)="loadNotifications()"
    >
        {{ 'COMMON.ACTIONS.LOAD_MORE' | translate }}
    </button>
</section>
