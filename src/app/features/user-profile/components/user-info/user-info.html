@if (loading()) {
<div class="skeleton-profile">
    <p-skeleton
        width="200px"
        height="2rem"
        styleClass="mb-5"
    />
    <div class="user-profile-header skeleton">
        <p-skeleton
            shape="circle"
            size="120px"
        />
        <div class="user-details ml-4">
            <p-skeleton
                width="150px"
                height="1.5rem"
                styleClass="mb-2"
            />
            <p-skeleton
                width="100px"
                height="1rem"
            />
        </div>
    </div>
    <div class="user-form">
        <div class="form-grid mb-4">
            <div class="form-group">
                <p-skeleton
                    width="100px"
                    height="1rem"
                    styleClass="mb-2"
                />
                <p-skeleton
                    width="100%"
                    height="45px"
                    borderRadius="12px"
                />
            </div>
            <div class="form-group">
                <p-skeleton
                    width="100px"
                    height="1rem"
                    styleClass="mb-2"
                />
                <p-skeleton
                    width="100%"
                    height="45px"
                    borderRadius="12px"
                />
            </div>
        </div>
        <div class="form-group mb-4">
            <p-skeleton
                width="100px"
                height="1rem"
                styleClass="mb-2"
            />
            <p-skeleton
                width="100%"
                height="45px"
                borderRadius="12px"
            />
        </div>
        <div class="form-grid mb-5">
            @for (i of [1, 2, 3, 4]; track i) {
            <div class="form-group">
                <p-skeleton
                    width="100px"
                    height="1rem"
                    styleClass="mb-2"
                />
                <p-skeleton
                    width="100%"
                    height="45px"
                    borderRadius="12px"
                />
            </div>
            }
        </div>
        <div class="form-footer">
            <p-skeleton
                width="120px"
                height="1.5rem"
            />
            <p-skeleton
                width="160px"
                height="45px"
                borderRadius="12px"
            />
        </div>
    </div>
</div>
} @else {
<section class="personal-info">
    <h2 class="section-title">Personal Information</h2>

    <!-- Avatar Section -->
    <div class="user-profile-header">
        <div
            class="avatar-wrapper"
            (click)="fileInput.click()"
        >
            @if (imageUrl()) {
            <img
                [src]="imageUrl()"
                alt="User Avatar"
                class="avatar-img"
                decoding="async"
            />
            } @else {
            <div class="avatar-placeholder">
                {{ user()?.firstName | slice : 0 : 1 }}{{ user()?.lastName |
                slice : 0 : 1 }}
            </div>
            }
            <div class="edit-overlay">
                <i class="fa-solid fa-pencil"></i>
            </div>
            <input
                #fileInput
                type="file"
                (change)="onFileSelected($event)"
                accept="image/*"
                style="display: none"
            />
        </div>
        <div class="user-details">
            <h3 class="display-name">
                {{ user()?.firstName }} {{ user()?.lastName }}
            </h3>
            <p class="user-role">{{ user()?.role | lowercase }}</p>
        </div>
    </div>

    <!-- Form Section -->
    <form
        class="user-form"
        [formGroup]="profileForm"
        (ngSubmit)="onSubmit()"
    >
        <div class="form-group full-width">
            <label class="form-label">First Name</label>
            <input
                type="text"
                pInputText
                formControlName="firstName"
                placeholder="Enter first name"
            />
            <app-field-validation
                [config]="firstNameConfig"
                [parentFormGroup]="profileForm"
            />
        </div>

        <div class="form-group full-width">
            <label class="form-label">Email</label>
            <input
                type="email"
                pInputText
                formControlName="email"
                [readonly]="true"
            />
            <app-field-validation
                [config]="emailConfig"
                [parentFormGroup]="profileForm"
            />
        </div>

        <div class="form-group full-width">
            <label class="form-label">Address</label>
            <input
                type="text"
                pInputText
                formControlName="address"
                placeholder="Enter address"
            />
            <app-field-validation
                [config]="addressConfig"
                [parentFormGroup]="profileForm"
            />
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <p-password
                    formControlName="newPassword"
                    placeholder="********"
                    [feedback]="false"
                    [toggleMask]="true"
                />
                <app-field-validation
                    [config]="passwordConfig"
                    [parentFormGroup]="profileForm"
                />
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <p-password
                    formControlName="confirmPassword"
                    placeholder="********"
                    [feedback]="false"
                    [toggleMask]="true"
                />
            </div>
        </div>

        <div class="form-footer">
            <button
                type="button"
                class="btn-link"
                (click)="getProfile()"
            >
                Discard Changes
            </button>
            <button
                type="submit"
                class="btn btn-primary"
                [disabled]="profileForm.invalid"
            >
                Save Changes
            </button>
        </div>
    </form>
</section>
}
