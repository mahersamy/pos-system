<div class="profile-wrapper">
    <div class="profile-container">
        <!-- Sidebar Navigation -->
        <aside class="profile-nav-card">
            <nav class="profile-nav">
                <button
                    class="nav-item"
                    [class.active]="activeView() === 'user-info'"
                    (click)="switchView('user-info')"
                >
                    <i class="fa-solid fa-user"></i>
                    <span>My Profile</span>
                </button>

                <button class="nav-item logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </nav>
        </aside>

        <!-- Content Area -->
        <main class="profile-content">
            @switch (activeView()) { @case ('user-info') {
            <app-user-info />
            } }
        </main>
    </div>
</div>
